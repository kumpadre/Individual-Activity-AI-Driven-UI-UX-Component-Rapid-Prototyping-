<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gridlark · Analytics Dashboard</title>
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

<div class="app">

  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">G</div>
      <span>Gridlark</span>
    </div>
    <nav class="nav">
      <a href="#" class="nav-item"><i data-lucide="layout-grid"></i>Dashboard</a>
      <a href="#" class="nav-item active"><i data-lucide="bar-chart-3"></i>Analytics</a>
      <a href="#" class="nav-item"><i data-lucide="users"></i>Users</a>
      <a href="#" class="nav-item"><i data-lucide="file-text"></i>Reports</a>
      <a href="#" class="nav-item"><i data-lucide="settings"></i>Settings</a>
    </nav>
  </aside>

  <!-- Mobile nav overlay -->
  <div class="mobile-nav-overlay" id="mobileNavOverlay">
    <aside class="mobile-nav">
      <div class="mobile-nav-header">
        <div class="brand">
          <div class="brand-mark">G</div>
          <span>Gridlark</span>
        </div>
        <button class="icon-btn" id="closeMobileNav" aria-label="Close navigation">
          <i data-lucide="x"></i>
        </button>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item"><i data-lucide="layout-grid"></i>Dashboard</a>
        <a href="#" class="nav-item active"><i data-lucide="bar-chart-3"></i>Analytics</a>
        <a href="#" class="nav-item"><i data-lucide="users"></i>Users</a>
        <a href="#" class="nav-item"><i data-lucide="file-text"></i>Reports</a>
        <a href="#" class="nav-item"><i data-lucide="settings"></i>Settings</a>
      </nav>
    </aside>
  </div>

  <!-- Main content -->
  <main class="main">

    <header class="page-header">
      <div class="page-header-left">
        <button class="icon-btn hamburger" id="openMobileNav" aria-label="Open navigation">
          <i data-lucide="menu"></i>
        </button>
        <div>
          <h1>Analytics dashboard</h1>
          <p>Monitor users, activity, and platform performance.</p>
        </div>
      </div>
      <div class="page-header-right">
        <button class="icon-btn" aria-label="Notifications">
          <i data-lucide="bell"></i>
          <span class="notif-dot"></span>
        </button>
        <div class="profile">
          <div class="avatar" style="background:#4F46E5">AD</div>
          <span class="profile-name">Admin</span>
        </div>
      </div>
    </header>

    <!-- Stat cards -->
    <section class="stats-grid" id="statsGrid"></section>

    <!-- Filter bar -->
    <section class="filter-bar">
      <div class="search-wrap">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search users by name or email..." aria-label="Search users" />
      </div>
      <div class="filters">
        <div class="select-wrap">
          <select id="statusFilter" aria-label="Filter by status">
            <option value="All">All statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Pending">Pending</option>
            <option value="Suspended">Suspended</option>
          </select>
          <i data-lucide="chevron-down"></i>
        </div>
        <div class="select-wrap">
          <select id="roleFilter" aria-label="Filter by role">
            <option value="All">All roles</option>
            <option value="Administrator">Administrator</option>
            <option value="Manager">Manager</option>
            <option value="User">User</option>
            <option value="Editor">Editor</option>
          </select>
          <i data-lucide="chevron-down"></i>
        </div>
        <div class="select-wrap">
          <select id="sortSelect" aria-label="Sort users">
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="most-active">Most active</option>
          </select>
          <i data-lucide="chevron-down"></i>
        </div>
      </div>
    </section>

    <!-- Table card -->
    <section class="table-card" id="tableCard">
      <div class="table-scroll" id="tableScroll">
        <table class="user-table" id="userTable">
          <thead>
            <tr>
              <th><button class="sort-head" data-col="name">User <span class="sort-arrows" data-arrows="name"><i data-lucide="chevron-up"></i><i data-lucide="chevron-down"></i></span></button></th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th><button class="sort-head" data-col="activity">Activity <span class="sort-arrows" data-arrows="activity"><i data-lucide="chevron-up"></i><i data-lucide="chevron-down"></i></span></button></th>
              <th><button class="sort-head" data-col="lastActive">Last active <span class="sort-arrows" data-arrows="lastActive"><i data-lucide="chevron-up"></i><i data-lucide="chevron-down"></i></span></button></th>
              <th><button class="sort-head" data-col="joined">Joined <span class="sort-arrows" data-arrows="joined"><i data-lucide="chevron-up"></i><i data-lucide="chevron-down"></i></span></button></th>
              <th class="actions-head">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div class="mobile-cards" id="mobileCards"></div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon"><i data-lucide="search"></i></div>
        <p class="empty-title">No users found</p>
        <p class="empty-sub">We couldn't find any users matching your search.</p>
        <button class="btn btn-primary" id="clearFiltersBtn">Clear filters</button>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </section>

  </main>
</div>

<!-- Modal root -->
<div id="modalRoot"></div>

<script src="script.js"></script>
</body>
</html>
